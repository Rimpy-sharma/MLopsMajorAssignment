name: MLOps Complete CI/CD Pipeline

on:
  push:
    branches:
      - main
      - docker_cicd
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: mlop2i-app
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-validate:
    name: Lint and Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint

      - name: Run flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        continue-on-error: true
        run: |
          black --check --diff .

      - name: Validate Dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile exists and is readable"
            cat Dockerfile
          fi

      - name: Validate Kubernetes manifest
        run: |
          if [ -f k8s-deployment.yaml ]; then
            echo "Kubernetes deployment file exists"
            cat k8s-deployment.yaml
          fi

      - name: Validate requirements.txt
        run: |
          if [ -f requirements.txt ]; then
            echo "Requirements file exists"
            cat requirements.txt
          fi

  test-train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: lint-and-validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify train.py exists
        run: |
          if [ -f train.py ]; then
            echo "train.py found"
            python -m py_compile train.py
          else
            echo "train.py not found!"
            exit 1
          fi

      - name: Run training script
        run: |
          python train.py
          
      - name: Verify model was created
        run: |
          if [ -f savedmodel.pth ]; then
            echo "Model saved successfully"
            ls -lh savedmodel.pth
          else
            echo "Model file not found!"
            exit 1
          fi

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            savedmodel.pth
            test_X.npy
            test_y.npy
          retention-days: 30

  test-model:
    name: Test Model Performance
    runs-on: ubuntu-latest
    needs: test-train
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Verify test.py exists
        run: |
          if [ -f test.py ]; then
            echo "test.py found"
            python -m py_compile test.py
          else
            echo "test.py not found!"
            exit 1
          fi

      - name: Run test script
        run: |
          python test.py

  test-app:
    name: Test Flask Application
    runs-on: ubuntu-latest
    needs: test-train
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Verify app.py exists
        run: |
          if [ -f app.py ]; then
            echo "app.py found"
            python -m py_compile app.py
          else
            echo "app.py not found!"
            exit 1
          fi

      - name: Test Flask app imports
        run: |
          python -c "from app import app; print('Flask app imports successfully')"

      - name: Test Flask app can start
        run: |
          timeout 10 python -c "from app import app; app.run()" || true
          echo "Flask app can be initialized"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-model, test-app]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:test
          load: true

      - name: Test Docker image
        run: |
          docker images
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:test python -c "import flask; print('Docker image works!')"

  push-docker:
    name: Push Docker Image to Hub
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docker_cicd')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        run: |
          TAGS="${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"
          TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip push (secrets not configured)
        if: ${{ secrets.DOCKER_USERNAME == '' || secrets.DOCKER_PASSWORD == '' }}
        run: |
          echo "⚠️  Docker Hub credentials not configured. Skipping push."
          echo "Add DOCKER_USERNAME and DOCKER_PASSWORD secrets to enable pushing."

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-docker
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Update Kubernetes deployment
        run: |
          sed -i "s|<YOUR_DOCKERHUB_USERNAME>/mlop2i-app:latest|${{ secrets.DOCKER_USERNAME }}/mlop2i-app:latest|g" k8s-deployment.yaml
          kubectl apply -f k8s-deployment.yaml --validate=false
          kubectl rollout status deployment/mlop2i-app-deployment --timeout=5m

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test-model, test-app, build-docker]
    if: always()
    
    steps:
      - name: Check workflow status
        run: |
          echo "## Workflow Completion Summary"
          echo "✅ Linting and Validation: ${{ needs.lint-and-validate.result }}"
          echo "✅ Model Training: ${{ needs.test-train.result }}"
          echo "✅ Model Testing: ${{ needs.test-model.result }}"
          echo "✅ App Testing: ${{ needs.test-app.result }}"
          echo "✅ Docker Build: ${{ needs.build-docker.result }}"